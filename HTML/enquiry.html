<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pixelite | Enquiry </title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>
    <!-- Navigation -->
    <header>

        <div class="logo">
            Pixelite<span>Solutions</span>
        </div>

        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About Us</a>
                </li>

                <li>
                    <a href="services.html">Services</a>
                </li>

                <li>
                    <a href="enquiry.html" class="active">
                        Enquiry
                    </a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="intro">
            <div class="section-title">
                <h2>Make an Enquiry</h2>

                <p>
                    Tell us about your computer or technical issue.
                </p>
            </div>
        </section>

        <section>
            <div class="form-container">
                <form id="enquiryForm">

                    <div class="form-group">
                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required>
                    </div>


                    <div class="form-group">

                        <label for="service">
                            Service Required
                        </label>

                        <select id="service" name="service" required>

                            <option value="">
                                -- Select a service --
                            </option>

                            <option value="laptop">
                                Laptop Repair
                            </option>

                            <option value="pc">
                                PC Repair
                            </option>

                            <option value="upgrade">
                                PC Upgrade
                            </option>

                            <option value="virus">
                                Virus Removal
                            </option>

                            <option value="data">
                                Data Recovery
                            </option>

                            <option value="other">
                                Other
                            </option>
                        </select>
                    </div>


                    <div class="form-group">

                        <label for="message">
                            Describe Your Enquiry
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            placeholder="Please describe the problem or service you require..."
                            required></textarea>
                    </div>


                    <button
                        type="submit"
                        class="btn">

                        Submit Enquiry
                    </button>
                </form>
            </div>
        </section>
    </main>


    <footer>

        <h3>Pixelite Computer Solutions</h3>

        <div class="footer-links">

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>

        </div>

        <p>
            &copy; 2026 Pixelite Computer Solutions.
            All rights reserved.
        </p>

    </footer>


    <script src="../JAVASCRIPT/script.js"></script>

</body>

</html>
